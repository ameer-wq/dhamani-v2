services:
  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_USER: dhamani_dev
      POSTGRES_PASSWORD: dhamani_dev_only
      POSTGRES_DB: dhamani_dev
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dhamani_dev -d dhamani_dev']
      interval: 2s
      timeout: 2s
      retries: 20
